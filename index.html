<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RENT DATA</title>
</head>

<body>

<h2>오피스 임대료</h2>

<div id="output"></div>
<canvas id="myChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const WORKER_URL = "https://fragrant-silence-2172.ipsw97.workers.dev/";

fetch(WORKER_URL)
  .then(res => res.json())
  .then(data => {

    const rows = data.SttsApiTblData[1].row;

    console.log(rows);

    const container = document.getElementById("output");

    rows.forEach(item => {
      const div = document.createElement("div");
      div.innerHTML = `${item.CLS_FULLNM} : ${item.DTA_VAL}`;
      container.appendChild(div);
    });

    const labels = rows.map(r => r.CLS_FULLNM);
    const values = rows.map(r => Number(r.DTA_VAL));

    new Chart(document.getElementById("myChart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "임대료",
          data: values,
          borderWidth: 2
        }]
      }
    });

  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML = "데이터 로딩 실패";
  });

</script>

</body>
</html>
