<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>오피스 임대료 실시간 차트</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            margin:30px;
            font-family:Arial;
        }

        h2{
            text-align:center;
        }

        canvas{
            max-width:1200px;
            height:600px;
            margin:auto;
        }

    </style>

</head>

<body>

<h2>오피스 임대료(실시간 OpenAPI)</h2>

<canvas id="myChart"></canvas>

<script>

const API_KEY = "e5bf77ede1bb46bc8c0f75a71f3d6127";

const url =
`https://www.reb.or.kr/r-one/openapi/SttsApiTblData.do
?KEY=${API_KEY}
&Type=json
&STATBL_ID=TT249843134237374
&DTACYCLE_CD=QY
&ITM_DATANO=100001`;

fetch(url.replace(/\n/g,""))

.then(response=>response.json())

.then(result=>{

    console.log(result);

    /*
    응답 확인용

    F12
    Console에서 구조 확인
    */

    const rows =
        result.SttsApiTblData?.[1]?.row ||
        result.row ||
        [];

    const labels = rows.map(item=>item.WRTTIME_IDTFR_ID);

    const values = rows.map(item=>Number(item.DTA_VAL));

    new Chart(document.getElementById("myChart"),{

        type:"line",

        data:{

            labels:labels,

            datasets:[{

                label:"오피스 임대료",

                data:values,

                borderWidth:3,

                tension:0.3

            }]

        },

        options:{

            responsive:true,

            maintainAspectRatio:false

        }

    });

})

.catch(error=>{

    console.log(error);

    document.body.innerHTML +=
    "<h3 style='color:red'>데이터를 불러오지 못했습니다.</h3>";

});

</script>

</body>

</html>
